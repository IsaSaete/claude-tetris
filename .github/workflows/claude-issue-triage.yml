name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(gh issue edit:*),Bash(gh issue comment:*)"
          prompt: |
            You are triaging a GitHub issue for a Tetris game project (vanilla
            HTML5 Canvas/JS, no dependencies — see CLAUDE.md for architecture:
            game.js, index.html, style.css).

            An issue was just ${{ github.event.action }}:
            - Issue number: #${{ github.event.issue.number }}
            - Title: ${{ github.event.issue.title }}
            - Body: ${{ github.event.issue.body }}
            - Author: ${{ github.event.issue.user.login }}

            Your tasks:

            1. **Add labels** based on the issue content. Use only these labels,
               and only add ones that aren't already applied:
               - `bug` — something is broken or behaving incorrectly
               - `enhancement` — new feature or improvement request
               - `question` — asking for help or clarification
               - `documentation` — docs need updating
               - `good first issue` — simple, beginner-friendly task
               - `duplicate` — if it seems like a known/repeated problem
               Apply with: `gh issue edit ${{ github.event.issue.number }} --add-label "<label>" --repo ${{ github.repository }}`

            2. **Post a comment** on the issue with `gh issue comment ${{ github.event.issue.number }} --body "..." --repo ${{ github.repository }}`,
               containing:
               - A brief, friendly summary of what the issue is about (1-2 sentences).
               - A "Formatted Report" section with:
                 - **Type**: Bug / Feature Request / Question / Other
                 - **Summary**: one clear sentence describing the problem or request
                 - **Steps to reproduce** (for bugs): list them if provided, otherwise
                   ask the reporter to add them
                 - **Expected behavior** (for bugs): what should happen
                 - **Suggested labels**: the labels you applied and why
               - A **Technical Diagnosis** section aimed at whoever implements the fix:
                 - Likely root cause or relevant area of the codebase, referencing
                   specific files/functions in game.js, index.html, or style.css
                   when relevant (use CLAUDE.md's architecture notes)
                 - Suggested approach/steps to implement the fix or feature
               - A closing note thanking the contributor.

            Be concise, helpful, and friendly. Do not over-engineer the response.
