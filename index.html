<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem("tetris-theme") === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    }
  </script>
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">THEME</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="theme-switch-slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div class="panel-section highscores-section">
      <span class="label">RECORDS</span>
      <table class="highscores-table" id="highscores-table-start">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Puntos</th>
            <th>Líneas</th>
            <th>Combo</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="highscores-summary" id="highscores-summary-start"></p>
      <button id="reset-highscores-btn" class="secondary-btn">Resetear records</button>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="overlay-highscores" class="hidden">
          <div id="name-entry" class="name-entry hidden">
            <label for="player-name-input" class="label">¡Nuevo récord! Nombre</label>
            <input type="text" id="player-name-input" maxlength="10" autocomplete="off" />
            <button id="save-highscore-btn">Guardar</button>
          </div>

          <table class="highscores-table" id="highscores-table-end">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Puntos</th>
                <th>Líneas</th>
                <th>Combo</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p class="highscores-summary" id="highscores-summary-end"></p>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
